name: Helm Pipeline

on:
  workflow_call:
    inputs:
      image_repository:
        description: Shared image repository prefix for frontend and backend; omit with image_tag to reuse installed release values.
        required: false
        type: string
      frontend_image_tag:
        description: Frontend image tag; omit with image_repository to reuse installed release values.
        required: false
        type: string
      backend_image_tag:
        description: Backend image tag; omit with image_repository to reuse installed release values.
        required: false
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true

  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.0.24

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          admin: "false"
          use-kubelogin: "true"

      - name: Setup Helm
        id: install
        uses: azure/setup-helm@v5
        with:
          version: "3.12.0"

      - name: Resolve image references
        id: images
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          FE_IMAGE_TAG: ${{ inputs.frontend_image_tag }}
          BE_IMAGE_TAG: ${{ inputs.backend_image_tag }}
        shell: bash
        run: |
          if [[ -z "$IMAGE_REPOSITORY" ]]; then
            echo "::error::Image repository is not provided. Please provide an image repository."
            exit 1
          fi

          values="$(helm get values raas --namespace raas --all --output json)"
          frontend_repository="${IMAGE_REPOSITORY}/raas-frontend"
          backend_repository="${IMAGE_REPOSITORY}/raas-backend"
          frontend_tag=""
          backend_tag=""

          if [[ -n "$FE_IMAGE_TAG" ]]; then
            frontend_tag="$FE_IMAGE_TAG"
          else
            frontend_tag="$(jq -er '.frontendImage.tag | select(type == "string" and length > 0)' <<< "$values")"
          fi

          if [[ -n "$BE_IMAGE_TAG" ]]; then
            backend_tag="$BE_IMAGE_TAG"
          else
            backend_tag="$(jq -er '.backendImage.tag | select(type == "string" and length > 0)' <<< "$values")"
          fi

          echo "Checking ${frontend_repository}:${frontend_tag} and ${backend_repository}:${backend_tag} exists...."

          if ! docker buildx imagetools inspect "${frontend_repository}:${frontend_tag}" > /dev/null; then
            echo "::error::Frontend image ${frontend_repository}:${frontend_tag} does not exist."
            exit 1
          fi
          if ! docker buildx imagetools inspect "${backend_repository}:${backend_tag}" > /dev/null; then
            echo "::error::Backend image ${backend_repository}:${backend_tag} does not exist."
            exit 1
          fi
          
          echo "Checks passed for ${frontend_repository}:${frontend_tag} and ${backend_repository}:${backend_tag}"

          echo "frontend_repository=${frontend_repository}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${frontend_tag}" >> "$GITHUB_OUTPUT"
          echo "backend_repository=${backend_repository}" >> "$GITHUB_OUTPUT"
          echo "backend_tag=${backend_tag}" >> "$GITHUB_OUTPUT"

      - name: Helm Deploy
        env:
          FRONTEND_IMAGE_REPOSITORY: ${{ steps.images.outputs.frontend_repository }}
          FRONTEND_IMAGE_TAG: ${{ steps.images.outputs.frontend_tag }}
          BACKEND_IMAGE_REPOSITORY: ${{ steps.images.outputs.backend_repository }}
          BACKEND_IMAGE_TAG: ${{ steps.images.outputs.backend_tag }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_APP_CLIENT_ID: ${{ vars.AZURE_APP_CLIENT_ID }}
        run: |
          helm upgrade --install raas ./helm/raas \
            --namespace raas \
            --set-string frontendImage.repository="${FRONTEND_IMAGE_REPOSITORY}" \
            --set-string frontendImage.tag="${FRONTEND_IMAGE_TAG}" \
            --set-string backendImage.repository="${BACKEND_IMAGE_REPOSITORY}" \
            --set-string backendImage.tag="${BACKEND_IMAGE_TAG}" \
            --set-string appConfig.azureOpenAIEndpoint="${AZURE_OPENAI_ENDPOINT}" \
            --set-string azureWorkloadIdentity.clientId="${AZURE_APP_CLIENT_ID}" \
            --atomic \
            --timeout 10m