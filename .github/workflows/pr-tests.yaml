name: PR Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/app_frontend/package-lock.json

      - name: Run frontend tests
        run: npm ci && npm test -- --run
        working-directory: frontend/app_frontend

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest -q
        working-directory: backend

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        id: install
        uses: azure/setup-helm@v5
        with:
          version: "3.12.0"

      - name: Run Helm lint
        run: |
          helm lint ./helm/raas --strict \
            --set-string backendImage.repository=example/raas-backend \
            --set-string backendImage.tag=ci \
            --set-string frontendImage.repository=example/raas-frontend \
            --set-string frontendImage.tag=ci
          helm lint ./helm/azure-monitor --strict
      
      - name: Render templates
        run: |
          helm template raas ./helm/raas --namespace raas \
            --set-string backendImage.repository=example/raas-backend \
            --set-string backendImage.tag=ci \
            --set-string frontendImage.repository=example/raas-frontend \
            --set-string frontendImage.tag=ci \
            --set-string appConfig.azureOpenAIEndpoint=https://example.invalid \
            --set-string azureWorkloadIdentity.clientId=00000000-0000-0000-0000-000000000000 \
            > rendered.yaml
  
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5 

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate