name: Build/Test Deploy Pipeline

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-dev.yaml"
  workflow_dispatch:
    inputs:
      fe-force:
        description: Force frontend build.
        required: false
        type: boolean
      be-force:
        description: Force backend build.
        required: false
        type: boolean
      deploy-force:
        description: Force deployment.
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - "frontend/**"
            backend:
              - "backend/**"

  frontend-test:
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || inputs.fe-force == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/app_frontend/package-lock.json

      - name: Run frontend tests
        run: npm ci && npm test -- --run
        working-directory: frontend/app_frontend
    
  frontend-build:
    needs: [changes, frontend-test]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_REPO }}/raas-frontend:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: docker push "$IMAGE"

  backend-test:
    needs: changes
    if: (needs.changes.outputs.backend == 'true' || inputs.be-force == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Run tests
        run: pytest -q
        working-directory: backend

  backend-build:
    needs: [changes, backend-test]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_REPO }}/raas-backend:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: docker push "$IMAGE"

  deploy:
    needs: [changes, frontend-build, backend-build]
    if: |
      always() && (
        (inputs.deploy-force == 'true' || (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')) &&
        (needs.changes.outputs.frontend != 'true' || needs.frontend-build.result == 'success') &&
        (needs.changes.outputs.backend != 'true' || needs.backend-build.result == 'success')
      )
    uses: ./.github/workflows/helm.yaml
    with:
      image_repository: ${{ vars.DOCKERHUB_REPO }}
      frontend_image_tag: ${{ needs.changes.outputs.frontend == 'true' && format('sha-{0}', github.sha) || '' }}
      backend_image_tag: ${{ needs.changes.outputs.backend == 'true' && format('sha-{0}', github.sha) || '' }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}